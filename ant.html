<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>앤트로픽 가격차</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e3de;--up:#c8372d;--dn:#2a62c9;--hit:#fff4d6;--hitline:#e0b23a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--mute:#9a9992;--line:#33332f;--up:#ff7a6e;--dn:#7aa7ff;--hit:#3a3220;--hitline:#c99a2a}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--mute:#9a9992;--line:#33332f;--up:#ff7a6e;--dn:#7aa7ff;--hit:#3a3220;--hitline:#c99a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.lab{font-size:12px;color:var(--mute)}
.val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gap{margin-top:8px;text-align:center}
.gap .val{font-size:34px}
.gap.hit{background:var(--hit);border-color:var(--hitline)}
.up{color:var(--up)}.dn{color:var(--dn)}
.msg{margin-top:8px;font-size:13px;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mute);font-weight:500}
th:first-child,td:first-child{text-align:left}
.note{font-size:12px;color:var(--mute);margin-top:12px}
</style>
</head>
<body>
<main>
<h1>앤트로픽 선물·나스닥 가격차</h1>
<div class="grid">
  <div class="card"><div class="lab">하이퍼리퀴드 xyz:ANT</div><div class="val" id="hl">–</div><div class="sub" id="hlsub">&nbsp;</div></div>
  <div class="card"><div class="lab">나스닥 ANT</div><div class="val" id="nq">–</div><div class="sub" id="nqsub">&nbsp;</div></div>
</div>
<div class="card gap" id="gapcard"><div class="lab">가격차 (선물 ÷ 주식 − 1)</div><div class="val" id="gap">–</div><div class="msg" id="msg">불러오는 중</div></div>
<table><thead><tr><th>시각</th><th>선물</th><th>주식</th><th>가격차</th></tr></thead><tbody id="log"></tbody></table>
<p class="note">5초마다 갱신해요. 선물은 하이퍼리퀴드 표시가격, 주식은 야후 나스닥 마지막 체결가예요(몇 초 늦을 수 있어요). 국내 증권사에서는 주식 공매도가 안 돼서, 선물이 2% 넘게 비쌀 때만(주식 매수 + 선물 매도) 노란색으로 표시해요. 매수·매도 호가 차이와 수수료(왕복 약 0.5~1%)는 빠져 있어요.</p>
</main>
<script>
const W='https://sunset-fx.ghlckd01.workers.dev';
const $=id=>document.getElementById(id), f2=v=>v.toFixed(2), kst=t=>new Date(t).toLocaleTimeString('ko-KR',{hour12:false,timeZone:'Asia/Seoul'});
let last=0;
async function hl(){
  const r=await fetch('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'metaAndAssetCtxs',dex:'xyz'})});
  const [m,c]=await r.json(), i=m.universe.findIndex(u=>u.name==='xyz:ANT'), x=c[i];
  return {mark:+x.markPx, mid:+(x.midPx||x.markPx), fund:+x.funding};
}
async function nq(){
  const p=Math.floor(Date.now()/5000)*5, q=`interval=1m&period1=${p-6*3600}&period2=${p+60}`;   // 5초마다 다른 주소라 워커 캐시를 거치지 않는다
  const j=await (await fetch(`${W}/chart/ANT?${q}`)).json(), r=j.chart.result[0], m=r.meta;
  const v=(r.indicators.quote[0].volume||[]).filter(Boolean).length;
  return {px:+m.regularMarketPrice, t:m.regularMarketTime*1000, traded:v>0 && m.regularMarketPrice!==83};
}
async function tick(){
  let a,b;
  try{a=await hl()}catch(e){$('msg').textContent='하이퍼리퀴드 불러오기 실패'}
  try{b=await nq()}catch(e){$('msg').textContent='나스닥 시세 불러오기 실패'}
  if(a){$('hl').textContent=f2(a.mark);$('hlsub').textContent='펀딩 시간당 '+(a.fund*100).toFixed(4)+'%'}
  if(b){$('nq').textContent=f2(b.px);$('nqsub').textContent=b.traded?'체결 '+kst(b.t):'첫 거래 전 (공모가 83)'}
  if(!a||!b)return;
  if(!b.traded){$('gap').textContent='–';$('msg').textContent='나스닥 첫 거래를 기다리는 중';$('gapcard').classList.remove('hit');return}
  const g=(a.mark/b.px-1)*100, hit=g>=2;
  $('gap').textContent=(g>0?'+':'')+g.toFixed(2)+'%';$('gap').className='val '+(g>0?'up':'dn');
  $('gapcard').classList.toggle('hit',hit);
  $('msg').textContent=hit?'선물이 2% 넘게 비싸요 (주식 매수 + 선물 매도 조건)':Math.abs(g)<=0.3?'거의 붙어 있어요 (0.3% 이내)':g<0?'선물이 더 싸요 (국내에서는 공매도가 안 돼서 할 수 없는 방향)':'가격차 2% 미만';
  if(Date.now()-last>=30000){last=Date.now();
    const tr=document.createElement('tr');tr.innerHTML=`<td>${kst(Date.now())}</td><td>${f2(a.mark)}</td><td>${f2(b.px)}</td><td class="${g>0?'up':'dn'}">${(g>0?'+':'')+g.toFixed(2)}%</td>`;
    const L=$('log');L.prepend(tr);while(L.children.length>40)L.lastChild.remove();}
}
tick();setInterval(tick,5000);
</script>
</body>
</html>
