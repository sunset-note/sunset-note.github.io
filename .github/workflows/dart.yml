# OpenDART 공모주: 매일 KST 7:40·18:40 eq(새 발행실적 수집 + 예상 균등 eq.json), 수동으로 probe/collect도 가능
name: dart
on:
  schedule:
    - cron: '40 22,9 * * *'   # UTC 22:40·9:40 = KST 7:40·18:40 (청약 첫날 8시 알림 전에 예측 갱신)
  workflow_dispatch:
    inputs:
      mode:
        description: eq, probe 또는 collect
        default: eq
      args:
        description: probe면 회사명(공백 구분), collect면 시작일(YYYY-MM-DD)
        default: ''
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I src/dart_${{ github.event.inputs.mode || 'eq' }}.py ${{ github.event.inputs.args }}
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
      - if: always() && github.event.inputs.mode == 'collect'
        uses: actions/upload-artifact@v4
        with:
          name: dart-ipo
          path: out/
          retention-days: 7
      - if: github.event.inputs.mode == 'eq' || github.event.inputs.mode == ''
        name: commit
        run: |
          git config user.name "sunset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eq.json src/dart_tot.json src/eq_log.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "예상 균등 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
